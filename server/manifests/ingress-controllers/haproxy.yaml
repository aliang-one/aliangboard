# Source: haproxy-ingress/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    helm.sh/chart: haproxy-ingress-0.16.1
    app.kubernetes.io/name: haproxy-ingress
    app.kubernetes.io/instance: haproxy-ingress
    app.kubernetes.io/version: "v0.16.1"
    app.kubernetes.io/managed-by: Helm
  name: haproxy-ingress
  namespace: ingress-haproxy
spec:
  replicas: 1
  revisionHistoryLimit: 
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  minReadySeconds: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy-ingress
      app.kubernetes.io/instance: haproxy-ingress
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/name: haproxy-ingress
        app.kubernetes.io/instance: haproxy-ingress
    spec:
      serviceAccountName: haproxy-ingress
      automountServiceAccountToken: false
      containers:
        - name: haproxy-ingress
          image: "quay.io/jcmoraisjr/haproxy-ingress:v0.16.1"
          imagePullPolicy: "IfNotPresent"
          args:
            - --configmap=ingress-haproxy/haproxy-ingress
            - --ingress-class=haproxy
            - --sort-backends
          ports:        
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: healthz
              containerPort: 10253      
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 10253
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: 10253
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /etc/haproxy
              name: scratch
              subPath: etc
            - mountPath: /var/lib/haproxy
              name: scratch
              subPath: lib
            - mountPath: /var/run/haproxy
              name: scratch
              subPath: run
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {}
      volumes:
        - name: scratch
          emptyDir: {}
        - name: kube-api-access
          projected:
            defaultMode: 0644
            sources:
            - serviceAccountToken:
                expirationSeconds: 3600
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                - key: ca.crt
                  path: ca.crt
            - downwardAPI:
                items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      hostNetwork: false
