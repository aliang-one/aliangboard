name: build-and-publish-image

on:
  push:
    tags: ['v*']   # 仅版本 tag 触发构建(普通 main 提交不再打包);如需手动构建走 workflow_dispatch
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}   # 按引用分组:tag 构建不被 main 构建互相 cancel
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU（arm64 仿真）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner (ghcr requires lowercase)
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker meta（标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/aliangboard
          tags: |
            type=raw,value=latest                      # latest 跟随最新发布 tag
            type=semver,pattern={{version}}          # v1.2.3 → 1.2.3(不可变,锁版本用)
            type=semver,pattern={{major}}.{{minor}}  # 同时产 1.2 滚动标签

      - name: Resolve VERSION（tag → semver；手动构建 → dev）
        id: ver
        run: echo "v=${{ steps.meta.outputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push（amd64+arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VERSION=${{ steps.ver.outputs.v }}
